<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מעבדת A/B Testing - חקר שווקים</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts: Heebo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Heebo', sans-serif;
        }
        .preview-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            cursor: pointer;
        }
        .preview-btn:hover {
            transform: translateY(-2px);
        }
        .preview-btn:active {
            transform: translateY(1px) scale(0.98);
        }
        .tab-btn.active {
            color: #2563eb;
            border-bottom: 3px solid #2563eb;
            font-weight: 700;
        }
        .tab-btn {
            color: #64748b;
            border-bottom: 3px solid transparent;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

    <!-- מסך כניסה ובחירת תפקיד (Role Selection Overlay) -->
    <div id="loginOverlay" class="fixed inset-0 z-50 bg-[#0f172a] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 text-center flex flex-col items-center relative z-10">
            <!-- סמל האוניברסיטה המעוצב -->
            <div class="w-20 h-20 bg-amber-500 rounded-2xl flex items-center justify-center shadow-lg mb-6 text-white text-4xl">
                🏛️
            </div>
            
            <h1 class="text-3xl font-black text-slate-900 mb-2">ברוכים הבאים</h1>
            <p class="text-sm font-medium text-slate-500 mb-6">סדנת חקר ביצועים ושיווק טכנולוגי</p>
            
            <p class="text-sm font-bold text-amber-600 mb-4">אנא בחרו ממשק התחברות:</p>

            <div id="roleSelectorContainer" class="w-full space-y-3">
                <button type="button" id="btnStudentSelect" class="w-full py-3.5 px-4 bg-slate-50 hover:bg-slate-100 text-slate-800 font-bold rounded-2xl border border-slate-200 shadow-sm flex items-center justify-center gap-2 transition cursor-pointer">
                    <span>כניסת סטודנטים</span>
                    <span class="text-xl">🎓</span>
                </button>

                <button type="button" id="btnLecturerSelect" class="w-full py-3.5 px-4 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-2xl shadow-md flex items-center justify-center gap-2 transition cursor-pointer">
                    <span>כניסת סגל (מרצה)</span>
                    <span class="text-xl">👨‍🏫</span>
                </button>
            </div>

            <!-- טופס סטודנט -->
            <div id="studentForm" class="hidden w-full mt-4 text-right">
                <label class="block text-xs font-bold text-slate-600 mb-1">שם מלא:</label>
                <input type="text" id="studentNameInput" placeholder="למשל: דניאל כהן" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl mb-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                
                <label class="block text-xs font-bold text-slate-600 mb-1">מספר צוות / קבוצה (אופציונלי):</label>
                <input type="text" id="studentGroupInput" placeholder="למשל: קבוצה 3" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl mb-4 text-sm focus:ring-2 focus:ring-blue-500 outline-none">

                <button type="button" id="btnStartPractice" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition cursor-pointer">
                    התחל תרגול 🚀
                </button>
                <button type="button" id="btnBackFromStudent" class="w-full py-2 mt-2 text-xs text-slate-400 hover:text-slate-600 cursor-pointer">חזרה לבחירה</button>
            </div>

            <!-- טופס מרצה -->
            <div id="lecturerForm" class="hidden w-full mt-4 text-right">
                <label class="block text-xs font-bold text-slate-600 mb-1">שם משתמש (אימייל):</label>
                <input type="email" id="lecturerEmailInput" placeholder="solomovi@gmail.com" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl mb-3 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                
                <label class="block text-xs font-bold text-slate-600 mb-1">סיסמה:</label>
                <input type="password" id="lecturerPassInput" placeholder="••••" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl mb-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none">
                
                <p id="lecturerError" class="text-xs text-rose-500 font-bold mb-3 hidden">שם משתמש או סיסמה שגויים</p>

                <button type="button" id="btnLoginLecturerSubmit" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl shadow-md transition cursor-pointer">
                    כניסה ללוח בקרה 📊
                </button>
                <button type="button" id="btnBackFromLecturer" class="w-full py-2 mt-2 text-xs text-slate-400 hover:text-slate-600 cursor-pointer">חזרה לבחירה</button>
            </div>
        </div>
    </div>

    <!-- בר עליון (Header) -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-reverse space-x-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white text-xl font-bold shadow-md">
                    📊
                </div>
                <div>
                    <h1 class="text-lg font-black text-slate-900 leading-tight">מעבדת A/B Testing & פסיכולוגיה שיווקית</h1>
                    <p class="text-xs text-slate-500">חקר שווקים למנהלים | המחלקה לשיווק טכנולוגי</p>
                </div>
            </div>

            <!-- סטטוס משתמש פעיל -->
            <div class="flex items-center gap-3">
                <div class="text-left hidden sm:block">
                    <div id="currentUserBadge" class="text-xs font-bold text-slate-700">מצב אורח</div>
                    <div id="currentGroupBadge" class="text-[11px] text-slate-400">לא מחובר</div>
                </div>
                <button type="button" id="btnSwitchUser" class="text-xs px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-bold border border-slate-300 transition cursor-pointer">
                    החלף משתמש 🔄
                </button>
            </div>
        </div>

        <!-- תפריט לשוניות -->
        <nav class="max-w-7xl mx-auto px-4 flex border-t border-slate-100 space-x-reverse space-x-6 overflow-x-auto">
            <button type="button" onclick="switchTab('labTab')" id="tabBtn-lab" class="tab-btn active py-3 text-sm font-bold flex items-center gap-1.5 whitespace-nowrap cursor-pointer">
                <span>🧪 מעבדת ניסוי ופרדיקציה</span>
            </button>
            <button type="button" onclick="switchTab('sampleTab')" id="tabBtn-sample" class="tab-btn py-3 text-sm font-bold flex items-center gap-1.5 whitespace-nowrap cursor-pointer">
                <span>📐 מחשבון גודל מדגם (Sample Size)</span>
            </button>
            <button type="button" onclick="switchTab('pitfallsTab')" id="tabBtn-pitfalls" class="tab-btn py-3 text-sm font-bold flex items-center gap-1.5 whitespace-nowrap cursor-pointer">
                <span>⚠️ מלכודות שיווקיות וטעויות</span>
            </button>
            <button type="button" onclick="switchTab('glossaryTab')" id="tabBtn-glossary" class="tab-btn py-3 text-sm font-bold flex items-center gap-1.5 whitespace-nowrap text-indigo-600 cursor-pointer">
                <span>📖 מילון מונחים</span>
            </button>
            <button type="button" onclick="switchTab('lecturerTab')" id="tabBtn-lecturer" class="tab-btn py-3 text-sm font-bold flex items-center gap-1.5 hidden text-amber-600 whitespace-nowrap cursor-pointer">
                <span>👨‍🏫 לוח בקרת מרצה (דאטה כיתתי)</span>
